<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialogue Summarizer</title>
  <style>
    :root {
      --bg: #f6f6f4; --surface: #ffffff; --text: #1b1b1a; --muted: #5f5e5a;
      --border: #dcdbd6; --accent: #2a78d6; --accent-text: #ffffff; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --surface: #1f1f1e; --text: #f0efec; --muted: #a9a8a2;
        --border: #3a3a37; --accent: #3987e5; --accent-text: #ffffff; --error: #f97066;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea {
      width: 100%; min-height: 240px; padding: 12px; resize: vertical;
      font: 15px/1.5 ui-monospace, Consolas, monospace; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .counter { margin-left: auto; color: var(--muted); font-size: 0.875rem; }
    .counter.over { color: var(--error); font-weight: 600; }
    button {
      padding: 10px 18px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .hint { color: var(--muted); font-size: 0.875rem; }
    #result {
      margin-top: 24px; padding: 16px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
    }
    #result[hidden] { display: none; }
    #result h2 { margin: 0 0 6px; font-size: 1rem; color: var(--muted); font-weight: 600; }
    #summary { margin: 0; font-size: 1.125rem; }
    #result.error { border-color: var(--error); }
    #result.error #summary { color: var(--error); font-size: 1rem; }
    #meta { margin: 8px 0 0; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
<main>
  <h1>Dialogue Summarizer</h1>
  <p class="subtitle">Paste a chat, one message per line as <code>Name: message</code>. Pegasus fine-tuned on SAMSum writes a short summary.</p>

  <label for="dialogue">Chat</label>
  <textarea id="dialogue" placeholder="Amanda: I baked cookies. Do you want some?&#10;Jerry: Sure!&#10;Amanda: I'll bring you tomorrow :-)"></textarea>

  <div class="row">
    <button id="summarize" class="primary" type="button">Summarize</button>
    <button id="example" type="button">Try an example</button>
    <span class="hint">Ctrl+Enter to summarize</span>
    <span id="counter" class="counter" aria-live="polite"></span>
  </div>

  <section id="result" hidden aria-live="polite">
    <h2 id="result-title">Summary</h2>
    <p id="summary"></p>
    <p id="meta"></p>
  </section>
</main>

<script>
  const EXAMPLE = [
    "Rita: I'm so bloody tired. Falling asleep at work. :-(",
    "Tina: I know what you mean.",
    "Tina: I keep on nodding off at my keyboard hoping that the boss doesn't notice..",
    "Rita: The time just keeps on dragging on and on and on....",
    "Rita: I keep on looking at the clock and there's still 4 hours of this drudgery to go.",
    "Tina: Times like these I really hate my work.",
    "Rita: I'm really not cut out for this level of boredom.",
    "Tina: Neither am I.",
  ].join("\n");

  const textarea = document.getElementById("dialogue");
  const button = document.getElementById("summarize");
  const counter = document.getElementById("counter");
  const result = document.getElementById("result");
  const title = document.getElementById("result-title");
  const summary = document.getElementById("summary");
  const meta = document.getElementById("meta");
  let maxChars = null;

  function updateCounter() {
    const n = textarea.value.length;
    counter.textContent = maxChars ? `${n.toLocaleString()} / ${maxChars.toLocaleString()} characters` : "";
    counter.classList.toggle("over", maxChars !== null && n > maxChars);
  }

  function show(kind, heading, text, details = "") {
    result.hidden = false;
    result.classList.toggle("error", kind === "error");
    title.textContent = heading;
    summary.textContent = text;
    meta.textContent = details;
  }

  // FastAPI returns 422 errors as {detail: [{msg: ...}, ...]}; turn them into one readable line.
  function errorMessage(body, status) {
    if (Array.isArray(body?.detail)) return body.detail.map(d => d.msg.replace(/^Value error, /, "")).join("; ");
    return body?.detail || `Request failed (HTTP ${status})`;
  }

  async function summarize() {
    const dialogue = textarea.value;
    if (!dialogue.trim()) { show("error", "Nothing to summarize", "Paste a chat first."); return; }
    button.disabled = true;
    button.textContent = "Summarizing…";
    const started = performance.now();
    try {
      const response = await fetch("/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dialogue }),
      });
      const body = await response.json().catch(() => null);
      if (!response.ok) { show("error", "Couldn't summarize", errorMessage(body, response.status)); return; }
      const seconds = ((performance.now() - started) / 1000).toFixed(1);
      show("ok", "Summary", body.summary, `Generated in ${seconds} s. Machine-written: check important details against the chat.`);
    } catch (err) {
      show("error", "Server unreachable", "Is uvicorn still running? " + err.message);
    } finally {
      button.disabled = false;
      button.textContent = "Summarize";
    }
  }

  button.addEventListener("click", summarize);
  document.getElementById("example").addEventListener("click", () => { textarea.value = EXAMPLE; updateCounter(); textarea.focus(); });
  textarea.addEventListener("input", updateCounter);
  textarea.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) summarize(); });

  fetch("/health").then(r => r.json()).then(h => { maxChars = h.max_input_chars; updateCounter(); }).catch(() => {});
</script>
</body>
</html>
