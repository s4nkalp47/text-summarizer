training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5   # keep the ".0": PyYAML reads "5e-5" as a string
  warmup_steps: 500
  weight_decay: 0.01
  logging_steps: 10
  fp16: false
  optim: adamw_torch
  gradient_checkpointing: false

tokenization:
  # From research/eda.py (Pegasus tokens, train split): p99 rounded up to a multiple of 64.
  max_input_length: 512   # dialogue p99 = 479; truncates 0.65% of dialogues
  max_target_length: 128  # summary p99 = 65, max = 80; truncates none

generation:
  # Chosen with research/decoding_sweep.py on 100 validation chats + 30 hand-labeled summaries:
  # 4 beams matched 8 on ROUGE and labels, ~42% faster. min_length 15 scored higher ROUGE but
  # produced 7/30 false statements vs 2/30 at min_length 0.
  num_beams: 4
  length_penalty: 0.8
  max_new_tokens: 128
  # The Pegasus checkpoint defaults to min_length 32 (a news-summary length). SAMSum's median
  # summary is ~23 tokens, so forcing 32 makes the model pad short summaries with invented text.
  min_length: 0
  no_repeat_ngram_size: 0   # 0 = off; 3 forbids repeating any 3-word phrase

evaluation:
  num_samples: 100        # test dialogues scored with ROUGE
  batch_size: 4
  num_saved_samples: 10   # rows written to samples.csv for reading by eye

smoke_test:
  enabled: true
  model_ckpt: t5-small
  num_samples: 64         # rows per split for transformation/training
  max_steps: 5
  eval_num_samples: 10    # test dialogues scored in smoke mode
