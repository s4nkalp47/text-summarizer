[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "textSummarizer"
version = "0.1.0"
description = "Dialogue summarization: fine-tune Pegasus on SAMSum and serve it with FastAPI"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import app.py from the repo root
